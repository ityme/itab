<!--
 * @file tab.html
 * @description The HTML structure for the browser start page.
 * @version 1.0.0
 * @date 2025-09-01
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iWonder Tab</title>
    <link rel="icon" type="image/svg+xml" href="assets/favico.svg" />
    <!-- INTEGRATE:CSS:START -->
    <link rel="stylesheet" href="tab.css" />
    <!-- INTEGRATE:CSS:END -->


  </head>
  <body>
    <!-- Main container for the search bar and related elements -->
    <div class="search-container">
      <!-- Container for the search engine selection -->
      <div class="engine-container">
        <div class="engine-list">
          <!-- Search engine item: Bing -->
          <div
            class="engine-item"
            name="bing"
            title="bing"
            value="https://www.bing.com/search?q={query}">
            <img src="assets/engine-bing.svg" alt="" draggable="false">
          </div>
          <!-- Search engine item: Baidu -->
          <div
            class="engine-item"
            name="baidu"
            title="baidu"
            value="https://www.baidu.com/s?wd={query}">
            <img src="assets/engine-baidu.svg" alt="" draggable="false">
          </div>
          <!-- Search engine item: Google -->
          <div
            class="engine-item"
            name="google"
            title="google"
            value="https://www.google.com/search?q={query}">
            <img src="assets/engine-google.svg" alt="" draggable="false">
          </div>
          <!-- Search engine item: Google AI Mode -->
          <div
            class="engine-item"
            name="google-ai-mode"
            title="google ai mode"
            value="https://www.google.com/search?udm=50&amp;q={query}">
            <img src="assets/engine-google-ai.svg" alt="" draggable="false">
          </div>
        </div>
      </div>

      <!-- Container for the input fields -->
      <div class="input-container">
        <!-- Main search input field -->
        <input
          class="search-input"
          name="search-input"
          type="text"
          autocomplete="off"
          placeholder="i wonder more about you ..." />
        <!-- Input field for settings (e.g., image path) -->
        <input
          class="settings-input"
          name="settings-input"
          type="text"
          autocomplete="off"
          placeholder="image path here ..." />
      </div>

      <!-- Container for shortcut links -->
      <div class="shortcut-container">
        <div class="shortcut-list">
          <!-- Shortcut item: Bilibili -->
          <div
            class="shortcut-item"
            name="bilibili"
            value="https://www.bilibili.com/"
            title="bilibili">
            <img src="assets/shortcut-bilibili.svg" alt="" draggable="false">
          </div>
          <!-- Shortcut item: YouTube -->
          <div
            class="shortcut-item"
            name="youtube"
            value="https://www.youtube.com/"
            title="youtube">
            <img src="assets/shortcut-youtube.svg" alt="" draggable="false">
          </div>
          <!-- Shortcut item: GitHub -->
          <div
            class="shortcut-item"
            name="github"
            value="https://github.com/feed"
            title="github">
            <img src="assets/shortcut-github.svg" alt="" draggable="false">
          </div>
        </div>
      </div>

      <!-- Container for action buttons -->
      <div class="button-container">
        <div class="button-list">
          <!-- Search button -->
          <div class="button-item search-button" title="search">
            <!-- Magnifying glass icon -->
            <img src="assets/button-search.svg" alt="" draggable="false">
          </div>
          <!-- reset button (for settings mode) -->
          <div class="button-item reset-button" title="reset">
            <img src="assets/button-reset.svg" alt="" draggable="false">
          </div>

          <!-- Cancel button (for settings mode) -->
          <div class="button-item cancel-button" title="cancel">
            <img src="assets/button-cancel.svg" alt="" draggable="false">
          </div>
          <!-- Settings button (hidden by default) -->
          <div class="button-item settings-button" title="settings">
            <!-- Settings icon -->
            <img src="assets/button-settings.svg" alt="" draggable="false">
          </div>
          <!-- Confirm button (for settings mode) -->
          <div class="button-item confirm-button" title="confirm">
            <img src="assets/button-confirm.svg" alt="" draggable="false">
          </div>
        </div>
      </div>
    </div>
    <!-- INTEGRATE:JS:START -->
    <script type="module" src="tab.js"></script>
    <!-- INTEGRATE:JS:END -->
  </body>
</html>
