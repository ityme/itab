<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="fl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- 柔和背景光晕 -->
  <circle cx="400" cy="400" r="380" fill="url(#fl-glow)" />

  <!-- 花束叶片与花朵群 -->
  <g transform="translate(400, 420)">
    <!-- 枝叶 -->
    <path d="M-180 80 C-100 -40, -40 -120, 0 -220 C40 -120, 100 -40, 180 80 C90 140, -90 140, -180 80 Z" fill="url(#leaf)" opacity="0.65" />
    <path d="M-220 20 C-120 -80, -30 -160, 0 -280 C30 -160, 120 -80, 220 20 C120 70, -120 70, -220 20 Z" fill="url(#leaf)" opacity="0.45" />

    <!-- 花卉簇 -->
    <g transform="translate(-100, -60)">
      <circle cx="0" cy="0" r="65" fill="url(#rose)" opacity="0.85" />
      <circle cx="-15" cy="-10" r="45" fill="#f43f5e" opacity="0.9" />
      <circle cx="0" cy="0" r="25" fill="#ffe4e6" />
      <circle cx="0" cy="0" r="12" fill="#fbbf24" />
    </g>

    <g transform="translate(100, -60)">
      <circle cx="0" cy="0" r="65" fill="url(#rose)" opacity="0.85" />
      <circle cx="15" cy="-10" r="45" fill="#f43f5e" opacity="0.9" />
      <circle cx="0" cy="0" r="25" fill="#ffe4e6" />
      <circle cx="0" cy="0" r="12" fill="#fbbf24" />
    </g>

    <g transform="translate(0, -140)">
      <circle cx="0" cy="0" r="85" fill="url(#rose)" opacity="0.9" />
      <circle cx="0" cy="-15" r="60" fill="#f43f5e" opacity="0.95" />
      <circle cx="0" cy="0" r="35" fill="#fff1f2" />
      <circle cx="0" cy="0" r="16" fill="#f59e0b" />
    </g>

    <g transform="translate(0, 30)">
      <circle cx="0" cy="0" r="75" fill="#ec4899" opacity="0.85" />
      <circle cx="0" cy="0" r="45" fill="#fbcfe8" />
      <circle cx="0" cy="0" r="18" fill="#fbbf24" />
    </g>
  </g>
</svg>
