name: CI/CD

on:
  push:
    tags: "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: pull repository
        uses: actions/checkout@v4

      - name: check files
        run: |
          ls -alh
          tree .

      - name: args setup
        run: |
          echo "PROJECT_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV
          echo "TAG_NAME=$(basename ${{ github.ref }})" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(basename ${{ github.repository }})-$(basename ${{ github.ref }})" >> $GITHUB_ENV

      - name: check args
        run: |
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "TAG_NAME=$TAG_NAME"
          echo "RELEASE_NAME=$RELEASE_NAME"

      - name: package extensions
        run: python3 scripts/package-extensions.py

      - name: check files
        run: |
          ls -alh dist
          unzip -l dist/itab-extension-chrome.zip | head
          unzip -l dist/itab-extension-firefox.zip | head

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/itab-extension-chrome.zip
            dist/itab-extension-edge.zip
            dist/itab-extension-firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
