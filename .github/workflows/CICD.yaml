name: CI/CD

on:
  push:
    tags: "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: pull repository
        uses: actions/checkout@v4

      - name: check files
        run: |
          ls -alh
          tree .

      - name: args setup
        run: |
          echo "PROJECT_NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV
          echo "TAG_NAME=$(basename ${{ github.ref }})" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(basename ${{ github.repository }})-$(basename ${{ github.ref }})" >> $GITHUB_ENV

      - name: check args
        run: |
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "TAG_NAME=$TAG_NAME"
          echo "RELEASE_NAME=$RELEASE_NAME"

      - name: create temporary workspace
        run: |
          mkdir _temp_workspace
          mkdir _temp_release_assets

      - name: build temporary workspace
        run: |
          mv src/ _temp_workspace/src/
          mv integrate.py _temp_workspace/

      - name: build release assets
        run: |
          mkdir -p _temp_release_assets/
          # 1. 编译独立单文件版 itab.html
          cd _temp_workspace
          python3 integrate.py
          mv itab.html ../_temp_release_assets/
          # 2. 打包 Edge / Chrome 扩展 zip
          cd src
          zip -r ../../_temp_release_assets/iwonder-tab-edge-extension.zip ./*
          cd ../..

      - name: check files
        run: |
          ls -alh
          tree .

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: _temp_release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
